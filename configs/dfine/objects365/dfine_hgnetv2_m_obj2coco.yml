__include__: [
  '../../dataset/coco_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_m_obj2coco

use_ema: True # turn true by default

DFINE:
  backbone: HGNetv2

BiSeNetDecoder:
  out_planes: 6 #91 # stuff image segmentation – per-pixel segmentation masks with 91 stuff categories, such as grass, wall, sky (see MS COCO Stuff)
  in_planes: [768, 1536]

# for unfreeze:
HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

# for freeze
# HGNetv2:
#   name: 'B2'
#   return_idx: [1, 2, 3]
#   freeze_at: 3           # заморозить все стадии
#   freeze_stem_only: False
#   freeze_norm: True      # также заморозить BatchNorm и другие norm-слои
#   use_lab: True

DFINETransformer:
  num_layers: 4  # 5 6
  eval_idx: -1  # -2 -3
  freeze: False # False by default !!!

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67
  freeze: False # False by default !!!

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# lr_scheduler:
#   type: CosineAnnealingLR
#   T_max: 30  # кол-во эпох до минимального lr
#   eta_min: 0.000001 #1e-6  # минимальный lr

epochs: 56 # Early stop
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 48
  collate_fn:
    stop_epoch: 48
    ema_restart_decay: 0.9999
    base_size_repeat: 6

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
